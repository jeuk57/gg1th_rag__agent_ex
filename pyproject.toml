[project]
name = "rag-agent-ex"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "docling[onnxruntime]>=2.133.0",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-docling>=3.0.0",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.2",
    "pandas>=3.0.6",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "python-env>=1.0.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "transformers>=4.51.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]